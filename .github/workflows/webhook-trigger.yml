name: Webhook Trigger

on:
  workflow_dispatch:
    inputs:
      webhook_data:
        description: "Webhook payload data"
        required: false
        type: string

# repos.createDispatchEvent に contents: write が要る。
permissions:
  contents: write

jobs:
  webhook-handler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json
          import os
          from api.stock_api import StockPriceAPI
          from bot.discord_bot import DiscordStockBot
          from utils.config import Config

          # 設定初期化
          config = Config()
          stock_api = StockPriceAPI(config)
          bot = DiscordStockBot(config, stock_api)

          # Webhookデータを処理
          webhook_data = '${{ github.event.inputs.webhook_data }}'
          if webhook_data:
              data = json.loads(webhook_data)
              print(f'Webhook data received: {data}')

          # 価格アラートチェック実行
          bot._check_price_alerts()
          "

      - name: Trigger repository dispatch
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'stock-update',
              client_payload: {}
            });
