name: Webhook Trigger

on:
  workflow_dispatch:
    inputs:
      webhook_data:
        description: "Webhook payload data"
        required: false
        type: string

# repos.createDispatchEvent に contents: write が要る。
permissions:
  contents: write

jobs:
  webhook-handler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json
          import os
          from api.stock_api import StockPriceAPI
          from bot.discord_bot import DiscordStockBot
          from utils.config import Config

          # 設定初期化
          config = Config()
          stock_api = StockPriceAPI(config)
          bot = DiscordStockBot(config, stock_api)

          # Webhookデータを処理
          webhook_data = '${{ github.event.inputs.webhook_data }}'
          if webhook_data:
              data = json.loads(webhook_data)
              print(f'Webhook data received: {data}')

          # 価格アラートチェック実行
          bot._check_price_alerts()
          "

      - name: Trigger repository dispatch
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'stock-update',
              client_payload: {}
            });
