name: Discord Stock Bot

on:
  schedule:
    # 平日 9:00 JST (00:00 UTC) - 市場開始前通知
    - cron: "0 0 * * 1-5"
    # 平日 15:30 JST (06:30 UTC) - 日本市場終了後通知
    - cron: "30 6 * * 1-5"
    # 平日 23:00 JST (14:00 UTC) - 米国市場終了後通知
    - cron: "0 14 * * 1-5"

  workflow_dispatch:
    inputs:
      notification_type:
        description: "Notification Type"
        required: true
        default: "regular"
        type: choice
        options:
          - regular
          - alert
          - test

  repository_dispatch:
    types: [stock-update]

# チェックアウトだけに使う（キャッシュと成果物のアクションはこの権限を使わない）。
permissions:
  contents: read

jobs:
  stock-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_INTERVAL: ${{ vars.NOTIFICATION_INTERVAL || '300' }}
          PRICE_CHANGE_THRESHOLD: ${{ vars.PRICE_CHANGE_THRESHOLD || '5.0' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Tokyo' }}
        run: |
          python main.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bot-logs
          path: bot.log
          retention-days: 7

  price-alert:
    runs-on: ubuntu-latest
    if: github.event.action == 'stock-update' || github.event.inputs.notification_type == 'alert'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check price alerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PRICE_CHANGE_THRESHOLD: ${{ vars.PRICE_CHANGE_THRESHOLD || '5.0' }}
        run: |
          python -c "
          from api.stock_api import StockPriceAPI
          from bot.discord_bot import DiscordStockBot
          from utils.config import Config

          config = Config()
          stock_api = StockPriceAPI(config)
          bot = DiscordStockBot(config, stock_api)

          # 価格アラートのみチェック
          bot._check_price_alerts()
          "
